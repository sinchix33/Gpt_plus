name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract project
        shell: bash
        run: |
          set -euo pipefail
          test -f ChatGPT-iOS-GitHub-ready.zip
          unzip -q ChatGPT-iOS-GitHub-ready.zip
          test -f ChatGPT-iOS/project.yml
          test -f ChatGPT-iOS/Resources/Info.plist
          echo "Swift source files before normalization:"
          find ChatGPT-iOS -type f -name '*.swift' ! -name Package.swift -print
          count=$(find ChatGPT-iOS -type f -name '*.swift' ! -name Package.swift | wc -l | tr -d ' ')
          test "$count" -ge 20

      - name: Normalize Swift source paths
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            target="ChatGPT-iOS/$base"
            if [ -e "$target" ]; then
              echo "Duplicate Swift filename while flattening: $base"
              exit 1
            fi
            mv "$file" "$target"
          done < <(find ChatGPT-iOS -mindepth 2 -type f -name '*.swift' ! -name Package.swift -print0)
          echo "Swift files at project root:"
          find ChatGPT-iOS -maxdepth 1 -type f -name '*.swift' -print
          count=$(find ChatGPT-iOS -maxdepth 1 -type f -name '*.swift' ! -name Package.swift | wc -l | tr -d ' ')
          test "$count" -ge 20

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ChatGPT-iOS
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -f ChatGPT-iOS.xcodeproj/project.pbxproj
          xcodebuild -list -project ChatGPT-iOS.xcodeproj

      - name: Build unsigned archive
        working-directory: ChatGPT-iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project ChatGPT-iOS.xcodeproj \
            -scheme ChatGPT-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ChatGPT-iOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ChatGPT-iOS.xcarchive/Products/Applications/ChatGPT.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/ChatGPT.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/ChatGPT-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/ChatGPT-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/ChatGPT-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-unsigned-IPA
          path: ChatGPT-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-archive-log
          path: ${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: ignore
          retention-days: 7
