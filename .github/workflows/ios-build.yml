name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, feature/secure-google-chatgpt-login]

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract base project and apply maintained overrides
        shell: bash
        run: |
          set -euo pipefail
          test -f ChatGPT-iOS-GitHub-ready.zip
          unzip -q ChatGPT-iOS-GitHub-ready.zip
          test -d ChatGPT-iOS
          cp -R .github/ios-overrides/ChatGPT-iOS/. ChatGPT-iOS/
          test -f ChatGPT-iOS/Core/Auth/AuthenticationManager.swift
          test -f ChatGPT-iOS/Views/Auth/LoginView.swift
          test -f ChatGPT-iOS/project.yml
          test -f ChatGPT-iOS/Resources/Info.plist
          count=$(find ChatGPT-iOS -type f -name '*.swift' ! -name Package.swift | wc -l | tr -d ' ')
          echo "Swift source files after overlays: $count"
          test "$count" -ge 20

      - name: Dump SidebarView source for repair
        shell: bash
        run: |
          set -euo pipefail
          echo "===== SIDEBAR_SOURCE_BEGIN ====="
          nl -ba ChatGPT-iOS/Views/Sidebar/SidebarView.swift
          echo "===== SIDEBAR_SOURCE_END ====="

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ChatGPT-iOS
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -f ChatGPT-iOS.xcodeproj/project.pbxproj
          xcodebuild -list -project ChatGPT-iOS.xcodeproj

      - name: Build unsigned archive
        working-directory: ChatGPT-iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project ChatGPT-iOS.xcodeproj \
            -scheme ChatGPT-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ChatGPT-iOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ChatGPT-iOS.xcarchive/Products/Applications/GPT Plus.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/GPT Plus.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/GPT-Plus-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/GPT-Plus-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/GPT-Plus-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Plus-unsigned-IPA
          path: GPT-Plus-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-archive-log
          path: ${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: ignore
          retention-days: 7
