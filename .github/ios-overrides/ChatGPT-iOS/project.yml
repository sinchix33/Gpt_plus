name: ChatGPT-iOS
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
targets:
  ChatGPT-iOS:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    sources:
      # Use the actual source directories explicitly. The upstream archive's
      # old flat Xcode project references files at the project root; scanning
      # "." can retain those stale paths instead of the reorganized sources.
      - path: App
      - path: Core
        excludes:
          - Authentication/AuthenticationManager.swift
      - path: Models
      - path: Network
      - path: Persistence
      - path: ViewModels
      - path: Views
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: GPT Plus
        CFBundleIdentifier: com.sinchix33.gptplus
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinchix33.gptplus
        PRODUCT_NAME: GPT Plus
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
